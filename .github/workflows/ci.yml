name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Install the Python validator runtime
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.0"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: research/rehearsal-dramaturg/uv.lock

      - name: Install validator dependencies from lockfile
        run: uv sync --frozen --project research/rehearsal-dramaturg

      - name: Test local Python contracts
        working-directory: research/rehearsal-dramaturg
        run: .venv/bin/python -m pytest tests -q

      - name: Verify fictional demo
        run: npm run demo:aurora-coast

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit public repository
        run: npm run audit:public

      - name: Audit generated browser bundles
        run: npm run audit:build-private
