name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none
          - language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none
          - language: python
            runner: ubuntu-latest
            build-mode: none
          - language: swift
            runner: macos-26
            build-mode: manual
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build iPhone and embedded Watch app for analysis
        if: matrix.language == 'swift'
        working-directory: research/body-context-native
        run: |
          # A scheme resolves CollectorCore; autobuild's bare -target did not.
          # Simulator compilation needs no signing, devices, pairing, or Health data.
          xcodebuild build \
            -project StorywalkerWellbeing.xcodeproj \
            -scheme StorywalkerWellbeing \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/storywalker-codeql" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_ENABLE_COMPILE_CACHE=NO \
            SWIFT_USE_INTEGRATED_DRIVER=NO

      - name: Build and test the fictional Swift package
        if: matrix.language == 'swift'
        run: swift test --package-path research/body-context-native --scratch-path "$RUNNER_TEMP/storywalker-swift-tests" --arch arm64

      - name: Analyze
        uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          category: /language:${{ matrix.language }}
