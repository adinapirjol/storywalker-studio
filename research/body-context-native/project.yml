name: StorywalkerWellbeing
options:
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
packages:
  CollectorCore:
    path: .
targets:
  StorywalkerWellbeing:
    type: application
    scheme: {}
    platform: iOS
    sources: [iPhone]
    dependencies:
      - target: StorywalkerWatch
        embed: true
      - package: CollectorCore
        product: CollectorCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: studio.storywalker.wellbeing.example
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_FILE: Info.example.plist
        INFOPLIST_KEY_NSHealthShareUsageDescription: Review selected heart-rate observations in a private wellbeing journal, with your own notes and control over deletion.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Add an approximate place to a wellbeing note when you explicitly request it.
        CODE_SIGN_ENTITLEMENTS: Collector.entitlements
        SWIFT_VERSION: '5.9'
        # Health read controls are available; collection requires explicit in-app Start and iOS permission.

  StorywalkerWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - path: Watch
      - path: Sources/CollectorCore/WatchSignal.swift
    info:
      path: Watch/Info.plist
      properties:
        WKApplication: true
        CFBundleDisplayName: Storywalker
        WKCompanionAppBundleIdentifier: studio.storywalker.wellbeing.example
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Connect available Watch heart-rate readings to your personal companion.
        NSHealthUpdateUsageDescription: Save meditation or workouts only when you explicitly start and finish your actual session.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.storywalker.wellbeing.example.watch
        CODE_SIGN_ENTITLEMENTS: Watch/Watch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: '5.9'
    scheme: {}
