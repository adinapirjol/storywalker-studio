[project]
name = "storywalker-rehearsal-dramaturg"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "langchain-core>=0.3,<2",
    "httpx>=0.28,<1",
    "pydantic-graph==2.54.0",
    "pydantic-ai-slim==2.54.0",
    "defusedxml==0.7.1",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=7,<8",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
